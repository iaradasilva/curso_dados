<script>
    async function loadLesson() {
        const urlParams = new URLSearchParams(window.location.search);
        let page = urlParams.get('page') || 'instalacao'; 

        // 🔒 SEGURANÇA: Permite apenas letras, números, hífens e underlines (Evita XSS e Path Traversal)
        page = page.replace(/[^a-zA-Z0-9_-]/g, '');
        if (!page) page = 'instalacao';

        // Destacar o item ativo na sidebar
        document.querySelectorAll('.sidebar-menu a').forEach(link => link.classList.remove('active'));
        const activeLink = document.getElementById(`link-${page}`);
        if (activeLink) activeLink.classList.add('active');

        const contentDiv = document.getElementById('lesson-content');

        try {
            const response = await fetch(`lessons/${page}.html`);
            if (response.ok) {
                contentDiv.innerHTML = await response.text();
            } else {
                contentDiv.innerHTML = `
                    <span class="badge badge-blue">Em Breve</span>
                    <h1>⚠️ Conteúdo em Construção</h1>
                    <p>Esta lição está a ser preparada para o curso.</p>
                    <div class="callout callout-info">
                        💡 Volte em breve para conferir o material completo!
                    </div>
                `;
            }
        } catch (error) {
            contentDiv.innerHTML = '<h1>Erro ao carregar o conteúdo.</h1>';
        }
    }

    // Navegação sem recarregar a página ao clicar nos links da sidebar
    document.addEventListener('click', (e) => {
        const link = e.target.closest('.sidebar-menu a');
        if (link) {
            e.preventDefault();
            const href = link.getAttribute('href');
            history.pushState(null, '', href);
            loadLesson();
        }
    });

    // Recarrega o conteúdo nos botões voltar/avançar do navegador
    window.addEventListener('popstate', loadLesson);
    window.addEventListener('DOMContentLoaded', loadLesson);
</script>
